name = "offline-helper-payments"
main = "src/index.js"
compatibility_date = "2026-06-01"
account_id = "4ae314cd311448df9909f40323d9c704"

# Cloudflare KV namespace for the fulfillment queue. Created with:
#   npx wrangler kv namespace create OFFLINE_HELPER_QUEUE
# The id below was generated for the pdbjork@gmail.com account.
[[kv_namespaces]]
binding = "QUEUE"
id = "3c7bbec4df2a4f918ea54648ea8a1570"

[vars]
# STRIPE_LIVE_APPROVED = "0" while STRIPE_SECRET_KEY is a test key.
# The Worker refuses to run if the key prefix doesn't match this flag.
# Flip to "1" only AFTER the test-mode dry run passes (see README).
STRIPE_LIVE_APPROVED = "0"

# Secrets (set with `npx wrangler secret put`):
#   STRIPE_SECRET_KEY       restricted test or live key
#   STRIPE_WEBHOOK_SECRET   signing secret from the Stripe webhook endpoint
